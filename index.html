<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mohabbat ke Paanch Pal</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7c6cc;--ink:#8a1038;--soft:#7a2a40;--card:#fbd5d9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){}
html,body{height:100%;margin:0;background:var(--bg);font-family:'Cormorant Garamond',Georgia,serif}
*{box-sizing:border-box}
.stage{height:100%;display:flex;align-items:center;justify-content:center;padding:12px}
.page{display:none;position:relative;width:100%;max-width:420px;height:100%;max-height:760px;background:linear-gradient(180deg,#fbd9dc,#f6bcc4);border-radius:6px;text-align:center;padding:64px 28px 28px;flex-direction:column;align-items:center;overflow:hidden}
.page.on{display:flex}
.page:before{content:"";position:absolute;inset:10px;border:1.5px solid #fff3ea;border-radius:4px;pointer-events:none}
h1{font-size:34px;font-weight:600;color:var(--ink);margin:0 0 14px;line-height:1.15}
.div{color:var(--ink);font-size:16px;margin:6px 0 20px;letter-spacing:6px}
p{font-size:21px;line-height:1.55;color:var(--soft);margin:0;font-weight:500}
.art{flex:1;display:flex;align-items:center;justify-content:center;font-size:120px;width:100%}
.next{margin-top:auto;border:1.5px solid var(--ink);background:#fde6e4;color:var(--ink);font:600 20px 'Cormorant Garamond',serif;padding:10px 38px;border-radius:30px;cursor:pointer}
.next:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:#e9a0ae}.dots i.a{background:var(--ink)}
.spacer{margin-top:auto;height:44px}
</style></head><body>
<div class="stage" id="s"></div>
<script>
const P=[
["Mohabbat Ka Pehla Ehsaas","Tu paas ho to dil ko sukoon milta hai,<br>Tere bina har lamha adhoora sa lagta hai.","🌹"],
["Teri Yaadon Ki Khushboo","Teri yaadon ki khushboo hawaon mein rehti hai,<br>Meri har dhadkan bas tera naam kehti hai.","💞"],
["Tum Mere Alfaaz Ho","Jo baat labon par aa na saki,<br>Woh tum meri aankhon ne padh li.","💌"],
["Har Dua Mein Tum","Meri har dua mein tera zikr hota hai,<br>Tu mile to lagta hai rab kareeb hota hai.","🌙"],
["Bas Tum Saath Raho","Na chaand chahiye, na sitaaron ki kami hai,<br>Bas tum saath raho, zindagi mukammal si hai.","🌸"]];
const s=document.getElementById('s');let i=0;
P.forEach((p,k)=>{const d=document.createElement('section');d.className='page';
d.innerHTML=`<h1>${p[0]}</h1><div class="div">— ♥ —</div><p>${p[1]}</p><div class="art">${p[2]}</div>`+
(k<P.length-1?`<button class="next">Next</button>`:`<div class="spacer"></div>`)+
`<div class="dots">${P.map((_,j)=>`<i class="${j==k?'a':''}"></i>`).join('')}</div>`;
if(k<P.length-1)d.querySelector('.next').onclick=()=>go(k+1);
s.appendChild(d)});
function go(n){i=n;[...s.children].forEach((e,k)=>e.classList.toggle('on',k==n))}
go(0);
</script></body></html>
